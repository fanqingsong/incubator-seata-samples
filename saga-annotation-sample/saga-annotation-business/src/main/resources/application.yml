server:
  port: 8088

spring:
  application:
    name: saga-annotation-business

seata:
  enabled: true
  application-id: saga-annotation-business
  tx-service-group: default_tx_group
  enable-auto-data-source-proxy: false
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
    disable-global-transaction: false
  config:
    type: file
  registry:
    type: file

dubbo:
  application:
    name: saga-annotation-business
    qos-enable: false
    serialize-check-status: DISABLE
  registry:
    address: zookeeper://${ZOOKEEPER_HOST:127.0.0.1}:2181
  protocol:
    name: dubbo
    port: 20883
  consumer:
    check: false
    timeout: 15000
    retries: 0
