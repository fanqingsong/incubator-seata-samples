spring:
  application:
    name: saga-annotation-payment
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/seata_pay?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${MYSQL_USER:user}
    password: ${MYSQL_PASSWORD:123456}

seata:
  enabled: true
  application-id: saga-annotation-payment
  tx-service-group: default_tx_group
  # Saga compensation updates the table itself. AT undo_log would refund a second time.
  enable-auto-data-source-proxy: false
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
    disable-global-transaction: false
  config:
    type: file
  registry:
    type: file

dubbo:
  application:
    name: saga-annotation-payment
    qos-enable: false
    serialize-check-status: DISABLE
  registry:
    address: zookeeper://${ZOOKEEPER_HOST:127.0.0.1}:2181
  protocol:
    name: dubbo
    port: 20881
  provider:
    timeout: 15000
    retries: 0
  scan:
    base-packages: org.apache.seata.payment
