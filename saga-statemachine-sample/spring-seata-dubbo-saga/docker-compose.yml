services:
  seata:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/seata-server:2.3.0
    hostname: seata
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      SEATA_PORT: "8091"
      STORE_MODE: file
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8091'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  zookeeper:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/zookeeper:3.8.4
    hostname: zookeeperAddress

    networks:
      default:
        aliases:
          - zookeeperAddress
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181; echo ruok >&3; timeout 2 cat <&3 | grep imok'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  spring-seata-dubbo-saga-provider:
    build:
      context: .
      args:
        MODULE: spring-seata-dubbo-saga-provider
        JAR_NAME: spring-seata-dubbo-saga-provider
    depends_on:
      seata:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    environment:
      E2E_ENV: open
    restart: on-failure

  spring-seata-dubbo-saga-consumer:
    build:
      context: .
      args:
        MODULE: spring-seata-dubbo-saga-consumer
        JAR_NAME: spring-seata-dubbo-saga-consumer
    depends_on:
      seata:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      spring-seata-dubbo-saga-provider:
        condition: service_started
    environment:
      E2E_ENV: open
    restart: on-failure

