services:
  seata:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/seata-server:2.3.0
    hostname: seata
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      SEATA_PORT: "8091"
      STORE_MODE: file
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8091'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  spring-seata-saga:
    build: .
    depends_on:
      seata:
        condition: service_healthy
    environment:
      E2E_ENV: open
    restart: on-failure

