services:
  seata:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/seata-server:2.3.0
    hostname: seata
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      SEATA_PORT: "8091"
      STORE_MODE: file
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8091'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:5.7
    hostname: mysqlAddress
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: seata
      MYSQL_USER: user
      MYSQL_PASSWORD: "123456"
    volumes:
      - ./e2e-files/sqlsh:/docker-entrypoint-initdb.d
    networks:
      default:
        aliases:
          - mysqlAddress
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  spring-seata:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      seata:
        condition: service_healthy
    environment:
      E2E_ENV: open
    restart: on-failure

